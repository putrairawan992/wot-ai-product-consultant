<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOT Product Consultant</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }

.chat-container {
  width: 420px; max-width: 100vw; height: 600px;
  background: #fff; border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  display: flex; flex-direction: column; overflow: hidden;
}

.chat-header {
  background: #1a3a5c; color: #fff;
  padding: 16px 20px; display: flex; align-items: center; gap: 12px;
}
.chat-header .avatar {
  width: 40px; height: 40px; background: #e8f0fe;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.chat-header h2 { font-size: 15px; font-weight: 600; }
.chat-header p { font-size: 12px; opacity: 0.75; }
.status-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; display: inline-block; margin-right: 4px; }

.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

.message { max-width: 85%; }
.message.bot { align-self: flex-start; }
.message.user { align-self: flex-end; }

.bubble {
  padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5;
}
.bot .bubble { background: #f0f2f5; color: #1a1a1a; border-bottom-left-radius: 4px; }
.user .bubble { background: #1a3a5c; color: #fff; border-bottom-right-radius: 4px; }

.bubble a { color: #1a73e8; text-decoration: none; font-weight: 500; }
.user .bubble a { color: #90caf9; }
.bubble a:hover { text-decoration: underline; }

.bubble .product-card {
  background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
  padding: 10px; margin-top: 8px;
}
.bubble .product-card h4 { font-size: 13px; font-weight: 600; color: #1a3a5c; margin-bottom: 4px; }
.bubble .product-card p { font-size: 12px; color: #555; line-height: 1.4; }
.bubble .product-card a { font-size: 12px; color: #1a73e8; display: inline-block; margin-top: 6px; }

.typing { display: flex; gap: 4px; padding: 12px 14px; background: #f0f2f5; border-radius: 16px; border-bottom-left-radius: 4px; width: fit-content; }
.typing span { width: 7px; height: 7px; background: #999; border-radius: 50%; animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

.input-area {
  padding: 12px 16px; border-top: 1px solid #e8e8e8;
  display: flex; gap: 8px; align-items: flex-end;
}
textarea {
  flex: 1; border: 1px solid #ddd; border-radius: 20px;
  padding: 10px 16px; font-size: 14px; resize: none; outline: none;
  max-height: 80px; min-height: 40px; line-height: 1.4;
  font-family: inherit;
}
textarea:focus { border-color: #1a3a5c; }
button {
  width: 40px; height: 40px; background: #1a3a5c; color: #fff;
  border: none; border-radius: 50%; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.2s;
}
button:hover { background: #2d5986; }
button:disabled { background: #ccc; cursor: default; }

.disclaimer { padding: 6px 16px 10px; font-size: 11px; color: #999; text-align: center; }

.bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
.bubble th { background: #1a3a5c; color: #fff; padding: 6px 10px; text-align: left; font-weight: 600; white-space: nowrap; }
.bubble td { padding: 5px 10px; border-bottom: 1px solid #e8e8e8; vertical-align: top; min-width: 80px; }
.bubble tr:last-child td { border-bottom: none; }
.bubble tr:nth-child(even) td { background: #f8f9fa; }
.bubble ul { padding-left: 18px; margin: 6px 0; }
.bubble li { margin: 3px 0; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -14px; padding: 0 14px; }
.message.bot { max-width: 95%; }
.prod-img { display: block; width: 100%; max-width: 200px; height: 140px; object-fit: contain; border-radius: 6px; border: 1px solid #e0e0e0; margin: 6px 0 2px; background: #fafafa; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🔬</div>
    <div>
      <h2>WOT Product Consultant</h2>
      <p><span class="status-dot"></span>Online · Ask me anything about testing equipment</p>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <textarea id="input" placeholder="Describe what you need to test..." rows="1" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="disclaimer">Prototype · Powered by AI · Product data from worldoftest.com</div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let history = [];

function addMessage(role, html) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// Auto-resize textarea
inputEl.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;

  addMessage('user', escapeHtml(text));
  history.push({ role: 'user', content: text });
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-8) })
    });
    const data = await res.json();
    removeTyping();

    if (data.error) {
      addMessage('bot', `<em style="color:#c00">${escapeHtml(data.error)}</em>`);
    } else {
      addMessage('bot', formatResponse(data.reply, data.images || {}));
      history.push({ role: 'assistant', content: data.reply });
    }
  } catch(e) {
    removeTyping();
    addMessage('bot', '<em style="color:#c00">Connection error. Please try again.</em>');
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatResponse(text, images = {}) {
  // Parse markdown tables before other processing
  text = text.replace(/(\|.+\|\n\|[-| :]+\|\n(?:\|.+\|\n?)+)/g, (match) => {
    const rows = match.trim().split('\n');
    const headers = rows[0].split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
    let body = '';
    for (let i = 2; i < rows.length; i++) {
      if (!rows[i].trim()) continue;
      const cells = rows[i].split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      body += `<tr>${cells}</tr>`;
    }
    return `<div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${body}</tbody></table></div>`;
  });
  // Markdown links [text](url) → <a> with optional product image
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, (_, label, url) => {
    const img = images[url] ? `<img src="${images[url]}" alt="${label}" class="prod-img">` : '';
    return `${img}<a href="${url}" target="_blank">${label}</a>`;
  });
  // Bold **text**
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Bullet lists
  text = text.replace(/(^|\n)([-*] .+)/gm, '$1<li>$2</li>');
  text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // Newlines (skip inside table tags)
  text = text.replace(/\n(?!<\/?(table|thead|tbody|tr|th|td))/g, '<br>');
  return text;
}

// Welcome message
window.onload = () => {
  setTimeout(() => {
    addMessage('bot', "Hi there! I'm your WOT product consultant. I can help you find the right testing equipment for your needs.<br><br>What are you looking to test? For example: <em>\"rubber hardness\"</em>, <em>\"plastic tensile strength\"</em>, or <em>\"paint adhesion\"</em>.");
  }, 300);
};
</script>
</body>
</html>
